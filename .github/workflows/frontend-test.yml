name: Test frontend

on:
  push:
    paths:
      - "docs/**"
      - "tests/frontend-data.test.cjs"
      - ".github/workflows/frontend-test.yml"
  pull_request:
    paths:
      - "docs/**"
      - "tests/frontend-data.test.cjs"
      - ".github/workflows/frontend-test.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Test data loading and rendering
        run: node --test tests/frontend-data.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/sw.js
          node --check docs/feedback-db.js
          node --check docs/admin-feedback.js
          node --check docs/supabase-config.js
      - name: Check required PWA files
        run: |
          test -f docs/index.html
          test -f docs/manifest.webmanifest
          test -f docs/icon-192.png
          test -f docs/icon-512.png
          grep -q 'CampusMed' docs/manifest.webmanifest
          grep -q 'campusmed-v33' docs/sw.js
      - name: Check page asset versions
        run: |
          for page in docs/*.html; do
            if grep -Fq 'style.css?v=' "$page"; then
              if ! grep -Fq 'style.css?v=28' "$page" && ! grep -Fq 'style.css?v=29' "$page"; then
                echo "CSS vechi în $page"
                exit 1
              fi
            fi
            if grep -Fq 'app.js?v=' "$page"; then
              if ! grep -Fq 'app.js?v=21' "$page"; then
                echo "Versiune app.js invalidă în $page"
                exit 1
              fi
            fi
          done
