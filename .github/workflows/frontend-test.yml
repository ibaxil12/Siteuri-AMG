name: Test frontend

on:
  push:
    paths:
      - "docs/*.html"
      - "docs/*.js"
      - "docs/*.css"
      - "docs/*.webmanifest"
      - "docs/*.png"
      - "docs/.nojekyll"
      - "tests/frontend-*.test.cjs"
      - ".github/workflows/frontend-test.yml"
  pull_request:
    paths:
      - "docs/*.html"
      - "docs/*.js"
      - "docs/*.css"
      - "docs/*.webmanifest"
      - "docs/*.png"
      - "docs/.nojekyll"
      - "tests/frontend-*.test.cjs"
      - ".github/workflows/frontend-test.yml"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Test data loading and frontend integrity
        run: node --test tests/frontend-*.test.cjs
      - name: Check JavaScript syntax
        run: |
          node --check docs/app.js
          node --check docs/sw.js
          node --check docs/feedback-db.js
          node --check docs/admin-feedback.js
          node --check docs/updates.js
          node --check docs/supabase-config.js
      - name: Check PWA generation
        run: |
          test -f docs/.nojekyll
          test -f docs/manifest.webmanifest
          test -f docs/icon-192.png
          test -f docs/icon-512.png
          grep -q 'CampusMed' docs/manifest.webmanifest
          grep -q 'campusmed-v41' docs/sw.js
          grep -q 'sw.js?v=41' docs/app.js
      - name: Check current asset versions
        run: |
          for page in docs/*.html; do
            grep -Fq 'style.css?v=34' "$page" || { echo "CSS vechi în $page"; exit 1; }
            if grep -Fq 'app.js?v=' "$page" && ! grep -Fq 'app.js?v=26' "$page"; then
              echo "Versiune app.js invalidă în $page"; exit 1
            fi
          done
