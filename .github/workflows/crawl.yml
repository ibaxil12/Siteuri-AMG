name: Actualizare index

on:
  schedule:
    # Verificare rapidă la fiecare 3 ore.
    - cron: "17 */3 * * *"
    # Reconstrucție completă zilnică.
    - cron: "47 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "crawler/**"
      - "requirements.txt"
      - ".github/workflows/crawl.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: crawl-index
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Alege tipul verificării
        id: crawl_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "47 2 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifică sursele
        run: python crawler/crawl.py
        env:
          CRAWL_MODE: ${{ steps.crawl_mode.outputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Salvează ambele variante ale indexului
        id: save
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json.gz docs/data.json
          if ! git diff --staged --quiet; then
            git commit -m "Actualizare date (${{ steps.crawl_mode.outputs.mode }})"
            git pull --rebase origin main
            git push origin main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publică datele noi pe GitHub Pages
        if: steps.save.outputs.changed == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' }
            })
