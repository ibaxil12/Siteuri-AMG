name: Actualizare index

on:
  schedule:
    # Verificare rapidă la fiecare 3 ore.
    - cron: "17 */3 * * *"
    # Reconstrucție completă zilnică.
    - cron: "47 2 * * *"
  workflow_dispatch:
  push:
    paths:
      - "crawler/**"
      - "requirements.txt"
      - ".github/workflows/crawl.yml"

permissions:
  contents: write
  pages: write

concurrency:
  group: crawl-index
  cancel-in-progress: false

jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - name: Sincronizează cu ultima versiune main
        run: git pull --ff-only origin main

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Alege tipul verificării
        id: crawl_mode
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] || [ "${{ github.event.schedule }}" = "47 2 * * *" ]; then
            echo "mode=full" >> "$GITHUB_OUTPUT"
          else
            echo "mode=quick" >> "$GITHUB_OUTPUT"
          fi

      - name: Verifică sursele
        run: python crawler/crawl.py
        env:
          CRAWL_MODE: ${{ steps.crawl_mode.outputs.mode }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Validează indexul generat
        run: |
          python - <<'PY'
          import gzip, json
          from pathlib import Path
          plain = json.loads(Path("docs/data.json").read_text(encoding="utf-8"))
          zipped = json.loads(gzip.decompress(Path("docs/data.json.gz").read_bytes()).decode("utf-8"))
          assert plain == zipped, "JSON și GZIP nu conțin aceleași date"
          items = plain.get("items", [])
          assert len(items) >= 100, "Index suspect de mic"
          assert plain.get("count") == len(items), "Count invalid"
          assert plain.get("updated"), "Lipsește timestamp-ul"
          assert plain.get("mode") in {"quick", "full"}, "Mod crawl invalid"
          assert len({x.get("url") for x in items}) == len(items), "URL-uri duplicate"
          status = plain.get("source_status", [])
          assert status and all(x.get("total_count", 0) > 0 for x in status), "Status surse invalid"
          print(f"Index valid: {len(items)} elemente, mod {plain['mode']}")
          PY

      - name: Salvează ambele variante ale indexului
        id: save
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp docs/data.json /tmp/campusmed-data.json
          cp docs/data.json.gz /tmp/campusmed-data.json.gz
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp /tmp/campusmed-data.json docs/data.json
            cp /tmp/campusmed-data.json.gz docs/data.json.gz
            git add docs/data.json docs/data.json.gz
            if git diff --staged --quiet; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git commit -m "Actualizare date (${{ steps.crawl_mode.outputs.mode }})"
            if git push origin HEAD:main; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "Branch-ul s-a modificat în timpul publicării; reîncercare $attempt/3."
          done
          echo "Nu am putut publica indexul după 3 încercări." >&2
          exit 1

      - name: Publică datele noi pe GitHub Pages
        if: steps.save.outputs.changed == 'true'
        uses: actions/github-script@v8
        with:
          script: |
            await github.request('POST /repos/{owner}/{repo}/pages/builds', {
              owner: context.repo.owner,
              repo: context.repo.repo,
              headers: { 'X-GitHub-Api-Version': '2026-03-10' }
            })
