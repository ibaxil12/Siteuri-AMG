<!DOCTYPE html>
<html lang="ro">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#52606d">
<meta name="description" content="Trimite feedback sau raportează o problemă pentru portalul AMG și Tehnică Dentară.">
<link rel="canonical" href="https://ibaxil12.github.io/Siteuri-AMG/feedback.html">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Feedback · AMG și Tehnică Dentară</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=10">
</head>
<body data-page="feedback">
<a class="skip" href="#main">Sari la conținut</a>
<div id="siteHeader"></div>
<main id="main" class="page-main">
<section class="page-hero"><div class="shell feedback-shell"><span class="eyebrow">Ajută-ne să îmbunătățim portalul</span><h1>Feedback & buguri</h1><p>Fără cont. Completezi mesajul, iar aplicația ta de email se deschide cu totul pregătit.</p><div class="page-program"><div class="seg" role="group" aria-label="Alege programul"><button type="button" data-program="AMG">AMG</button><button type="button" data-program="TD">Tehnică dentară</button><button type="button" data-program="both">Ambele</button></div></div></div></section>
<section class="section-compact"><div class="shell feedback-shell"><form class="feedback-form" id="feedbackForm">
<div class="form-row"><div class="form-field"><label for="email">Emailul tău</label><input id="email" type="email" autocomplete="email" placeholder="exemplu@email.com" required></div><div class="form-field"><label for="category">Tip mesaj</label><select id="category" required><option value="">Alege o categorie</option><option value="Bug">Bug / problemă tehnică</option><option value="Sugestie">Sugestie / idee</option><option value="Informație greșită">Informație greșită</option><option value="Altceva">Altceva</option></select></div></div>
<div class="form-field"><label for="message">Mesaj</label><textarea id="message" rows="8" placeholder="Descrie problema sau sugestia…" required></textarea><p class="field-help">Nu trimite parole, CNP sau alte informații sensibile.</p></div>
<div class="form-field"><label for="name">Nume <span class="optional">(opțional)</span></label><input id="name" type="text" autocomplete="name" placeholder="Cum te cheamă?"></div>
<button class="primary-btn feedback-submit" type="submit">Trimite prin email</button><p class="feedback-status" id="feedbackStatus" aria-live="polite"></p>
</form></div></section>
</main><div id="siteFooter"></div><div id="mobileNav"></div><div id="drawerRoot"></div><script src="app.js?v=10" defer></script><script src="enhancements.js?v=10" defer></script></body></html>
