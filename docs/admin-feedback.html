<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Feedback</title><link rel="stylesheet" href="style.css?v=20"></head><body class="admin-page"><main class="admin-main"><div class="shell admin-shell"><div class="admin-top"><a class="brand" href="index.html"><span class="brand-mark">C+</span><span>CampusMed</span></a><button id="adminLogout" class="secondary-btn" hidden>Ieșire</button></div><section id="adminLogin" class="admin-login page-panel"><span class="eyebrow">Zonă privată</span><h1>Admin Feedback</h1><p>Autentifică-te cu contul de administrator din Supabase.</p><form id="adminLoginForm"><div class="form-field"><label for="adminEmail">Email</label><input id="adminEmail" type="email" required></div><div class="form-field"><label for="adminPassword">Parolă</label><input id="adminPassword" type="password" required></div><button class="primary-btn">Intră în panou</button><p id="adminLoginStatus" class="feedback-status"></p></form></section><section id="adminDashboard" hidden><div class="admin-heading"><div><span class="eyebrow">Administrare</span><h1>Feedback primit</h1><p id="adminCount" class="count"></p></div><button id="adminRefresh" class="secondary-btn">Actualizează</button></div><div class="admin-filters"><button class="filter-chip on" data-feedback-filter="all">Toate</button><button class="filter-chip" data-feedback-filter="nou">Noi</button><button class="filter-chip" data-feedback-filter="in_lucru">În lucru</button><button class="filter-chip" data-feedback-filter="rezolvat">Rezolvate</button></div><div id="adminFeedbackList" class="admin-feedback-list"></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=1"></script><script src="admin-feedback.js?v=1"></script></body></html>
