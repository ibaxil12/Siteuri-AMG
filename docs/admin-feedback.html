<!DOCTYPE html><html lang="ro"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Admin Feedback</title><link rel="stylesheet" href="style.css?v=22"></head><body class="admin-page"><main class="admin-main"><div class="shell admin-shell"><div class="admin-top"><a class="brand" href="index.html"><span class="brand-mark">C+</span><span>CampusMed</span></a><button id="adminLogout" class="secondary-btn" hidden>Ieșire</button></div><section id="adminLogin" class="admin-login page-panel"><span class="eyebrow">Zonă privată</span><h1>Admin Feedback</h1><p>Autentifică-te cu contul de administrator din Supabase.</p><form id="adminLoginForm"><div class="form-field"><label for="adminEmail">Email</label><input id="adminEmail" type="email" required></div><div class="form-field"><label for="adminPassword">Parolă</label><input id="adminPassword" type="password" required></div><button class="primary-btn">Intră în panou</button><p id="adminLoginStatus" class="feedback-status"></p></form></section><section id="adminDashboard" hidden><nav class="admin-tabs"><button class="filter-chip on" data-admin-tab="feedback">Feedback</button><button class="filter-chip" data-admin-tab="updates">Update-uri & Roadmap</button></nav><div id="adminFeedbackPanel"><div class="admin-heading"><div><span class="eyebrow">Administrare</span><h1>Feedback primit</h1><p id="adminCount" class="count"></p></div><button id="adminRefresh" class="secondary-btn">Actualizează</button></div><div class="admin-filters"><button class="filter-chip on" data-feedback-filter="all">Toate</button><button class="filter-chip" data-feedback-filter="nou">Noi</button><button class="filter-chip" data-feedback-filter="in_lucru">În lucru</button><button class="filter-chip" data-feedback-filter="rezolvat">Rezolvate</button></div><div id="adminFeedbackList" class="admin-feedback-list"></div></div><div id="adminUpdatesPanel" hidden><div class="admin-heading"><div><span class="eyebrow">Conținut public</span><h1>Update-uri & Roadmap</h1><p class="count">Modificările apar automat pe site.</p></div></div><form id="updateEditor" class="page-panel update-editor"><input id="updateId" type="hidden"><div class="form-row"><div class="form-field"><label for="updateType">Tip</label><select id="updateType"><option value="update">Update publicat</option><option value="roadmap">Roadmap</option></select></div><div class="form-field"><label for="updateStatus">Status</label><select id="updateStatus"><option value="publicat">Publicat</option><option value="planificat">Planificat</option><option value="in_lucru">În lucru</option></select></div></div><div class="form-field"><label for="updateTitle">Titlu</label><input id="updateTitle" maxlength="140" required placeholder="Ex: Am îmbunătățit căutarea"></div><div class="form-field"><label for="updateDescription">Descriere</label><textarea id="updateDescription" rows="4" maxlength="1000" placeholder="Descriere scurtă…"></textarea></div><div class="form-row"><div class="form-field"><label for="updateDate">Data</label><input id="updateDate" type="date"></div><div class="form-field"><label for="updateOrder">Ordine</label><input id="updateOrder" type="number" value="100" min="0" max="9999"></div></div><label class="admin-visible-check"><input id="updateVisible" type="checkbox" checked> Vizibil public</label><div class="admin-card-actions"><button id="updateCancel" class="secondary-btn" type="button" hidden>Anulează editarea</button><button class="primary-btn" type="submit">Salvează</button></div><p id="updateEditorStatus" class="feedback-status"></p></form><div id="adminUpdatesList" class="admin-feedback-list"></div></div></section></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase-config.js?v=1"></script><script src="admin-feedback.js?v=2"></script></body></html>
